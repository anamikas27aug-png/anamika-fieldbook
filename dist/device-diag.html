<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fieldbook · Device motion check</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f2ed;color:#382632;font:14px/1.6 system-ui}header{padding:20px}h1{font-size:22px}p{max-width:700px}iframe{width:100%;height:72svh;border:1px solid #bca4b8;display:block}pre{padding:20px;white-space:pre-wrap;background:#eee4f0;margin:0}button,a{min-height:44px;display:inline-flex;align-items:center;color:inherit}button{padding:8px 16px;margin-right:20px;background:#873f61;color:white;border:0;border-radius:30px;font:inherit}</style></head><body><header><h1>Device motion check</h1><p>Scroll inside the portfolio below. This check shows which release loaded and whether its scenes change on your device. Everything stays on this device.</p><button type="button" id="copy">Copy report</button><a href="./">Return to the portfolio ↗</a></header><iframe src="./?device-check=1" title="Portfolio for device motion testing"></iframe><pre id="report">Loading the fieldbook…</pre><script>
const output=document.getElementById('report'),frame=document.querySelector('iframe');let changes=0,old='',firstY=0,maxDelta=0,ticks=0,lastScroll=0;const errors=[];let last='';
function inspect(){try{const w=frame.contentWindow,d=w.document,r=d.documentElement,states=Array.from(d.querySelectorAll('[data-sc-verify-state]')).map(e=>({scene:e.dataset.beat||e.className,state:e.dataset.scVerifyState,top:Math.round(e.getBoundingClientRect().top),height:Math.round(e.getBoundingClientRect().height)}));const visible=states.filter(s=>s.top< w.innerHeight&&s.top+s.height>0);const signature=visible.map(s=>s.state).join('|');if(old&&old!==signature)changes++;old=signature;lastScroll=w.scrollY;maxDelta=Math.max(maxDelta,Math.abs(lastScroll-firstY));const disabled=r.classList.contains('motion-off');let saved='storage unavailable';try{saved=w.localStorage.getItem('anamika-motion')||'default on';}catch{}last=JSON.stringify({release:r.dataset.release,coordinatorReady:r.dataset.fieldbookReady||false,systemReducedMotion:w.matchMedia('(prefers-reduced-motion: reduce)').matches,savedMotion:saved,motionDisabled:disabled,viewport:[w.innerWidth,w.innerHeight],touchPoints:navigator.maxTouchPoints,scrollY:Math.round(lastScroll),maximumScrollChange:Math.round(maxDelta),coordinatorFrames:r.dataset.fieldbookFrames||0,diagnosticAnimationFrames:ticks,observedSceneChanges:changes,verdict:disabled?'READING MODE':maxDelta<40?'SCROLL TO TEST':changes>2?'MOVING':'NO SCENE CHANGE OBSERVED',stageGeometry:visible,errors},null,2);output.textContent=last;}catch(e){output.textContent='Could not read this local frame: '+e.message;}ticks++;requestAnimationFrame(inspect);}
frame.addEventListener('load',()=>{try{firstY=frame.contentWindow.scrollY;frame.contentWindow.addEventListener('error',e=>errors.push(e.message));}catch{}requestAnimationFrame(inspect);});document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(last);document.getElementById('copy').textContent='Report copied';}catch{output.focus();document.getElementById('copy').textContent='Select and copy the report below';}});
</script></body></html>
